# Closr private beta on Fly.io: the lowest-cost configuration (see docs/beta-hosting.md).
#   One machine runs the API and the preparation worker together, and stops when nobody is using
#   Closr. It starts again on the next request (a few seconds). Postgres is external (Neon free
#   plan) and images live in a private Tigris bucket, so the machine keeps no data of its own.
# Deploy with:  fly deploy -c fly.beta.toml
app = "closr-api"
primary_region = "iad"          # near Neon's us-east-1 region

[build]
  dockerfile = "server/Dockerfile"

[env]
  CLOSR_MODEL_PROVIDER = "gemini"
  CLOSR_ALLOW_ANONYMOUS = "0"     # Sign in with Apple only
  CLOSR_RUN_WORKER = "1"          # worker runs inside the API process; it keeps the machine awake while jobs run
  CLOSR_APPLE_AUDIENCES = "com.chrisallenclark.closr"
  # AI spending protections. The integration-test budget left from the approved $3 is $1.84:
  # the all-time cap stops all model calls before it could be exceeded.
  CLOSR_GLOBAL_TOTAL_USD = "1.80"
  CLOSR_GLOBAL_DAILY_USD = "1.80"
  CLOSR_USER_DAILY_USD = "1.50"
  CLOSR_USER_MONTHLY_USD = "1.80"
  CLOSR_STARTING_CREDITS = "10"
  CLOSR_JOBS_PER_HOUR = "10"
  CLOSR_MAX_ATTEMPTS = "2"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"     # no traffic and no pending jobs: the machine stops (compute billing stops)
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  memory = "2gb"                  # measured peak during a preparation: 1.15 GB
  cpus = 1
  cpu_kind = "shared"
