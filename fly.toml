# Closr garment preparation server on Fly.io (see server/DEPLOY.md).
# Two process groups from one image: the HTTPS API, and the preparation worker.
app = "closr-api"
primary_region = "iad"

[build]
  dockerfile = "server/Dockerfile"

[env]
  CLOSR_MODEL_PROVIDER = "gemini"
  CLOSR_ALLOW_ANONYMOUS = "0"
  CLOSR_RUN_WORKER = "0"
  CLOSR_APPLE_AUDIENCES = "com.chrisallenclark.closr"
  # Spending limits, enforced before every model call. Raise deliberately.
  CLOSR_GLOBAL_DAILY_USD = "3.00"
  CLOSR_USER_DAILY_USD = "1.50"
  CLOSR_USER_MONTHLY_USD = "10.00"
  CLOSR_STARTING_CREDITS = "25"
  CLOSR_JOBS_PER_HOUR = "10"
  CLOSR_MAX_ATTEMPTS = "2"

[processes]
  app = "uvicorn closr_server.app:create_app --factory --host 0.0.0.0 --port 8080 --proxy-headers"
  worker = "python -m closr_server.worker"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  processes = ["app"]
  memory = "1gb"
  cpus = 1

[[vm]]
  processes = ["worker"]
  memory = "2gb"
  cpus = 2
