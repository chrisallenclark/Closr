# fly.toml app configuration file generated for closr on 2026-11-12T18:31:31Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'closr'
primary_region = 'ams'

[build]
  dockerfile = 'server/Dockerfile'

[env]
  CLOSR_ALLOW_ANONYMOUS = '0'
  CLOSR_APPLE_AUDIENCES = 'com.chrisallenclark.closr'
  CLOSR_GLOBAL_DAILY_USD = '1.80'
  CLOSR_GLOBAL_TOTAL_USD = '1.80'
  CLOSR_JOBS_PER_HOUR = '10'
  CLOSR_MAX_ATTEMPTS = '2'
  CLOSR_MODEL_PROVIDER = 'gemini'
  CLOSR_RUN_WORKER = '1'
  CLOSR_STARTING_CREDITS = '10'
  CLOSR_USER_DAILY_USD = '1.50'
  CLOSR_USER_MONTHLY_USD = '1.80'
  kill_timeout = '30'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '30s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
